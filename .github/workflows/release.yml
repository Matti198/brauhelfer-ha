name: Release

# Ein Tag wie v0.6.0 erzeugt ein GitHub-Release. HACS zeigt es dann als Update an.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version im Manifest prüfen
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/brauhelfer/manifest.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "manifest.json hat $v, Tag ist ${GITHUB_REF_NAME}"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
